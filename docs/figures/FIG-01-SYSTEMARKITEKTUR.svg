<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><style>.t{font:600 20px sans-serif;fill:#111}.h{font:600 15px sans-serif;fill:#111}.s{font:13px sans-serif;fill:#222}.b{fill:#fff;stroke:#555;stroke-width:1.4}.a{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#m)}.n{fill:#f6f6f6;stroke:#777;stroke-width:1.2}.note{font:12px sans-serif;fill:#444}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs>
<text class="t" x="30" y="35">Gjæringsassistent – systemarkitektur</text>
<rect class="b" x="40" y="90" width="270" height="170" rx="8"/><text class="h" x="175" y="120" text-anchor="middle">MariaDB / InnoDB</text><text class="s" x="65" y="150">• eneste persistente autoritet</text><text class="s" x="65" y="175">• data, regler og frozen session</text><text class="s" x="65" y="200">• append-only historikk</text><text class="s" x="65" y="225">• read-model + displayfelt</text>
<rect class="b" x="415" y="90" width="270" height="170" rx="8"/><text class="h" x="550" y="120" text-anchor="middle">Node-RED</text><text class="s" x="440" y="150">• generisk motor</text><text class="s" x="440" y="175">• orchestration / transaksjoner</text><text class="s" x="440" y="200">• HA-history ingest</text><text class="s" x="440" y="225">• transport / publikasjon</text>
<rect class="b" x="790" y="90" width="270" height="170" rx="8"/><text class="h" x="925" y="120" text-anchor="middle">Home Assistant / frontend</text><text class="s" x="815" y="150">• operatørinteraksjon</text><text class="s" x="815" y="175">• ren visning av read-model</text><text class="s" x="815" y="200">• ingen domenefallback</text><text class="s" x="815" y="225">• ingen lokal domenestate</text>
<line class="a" x1="310" y1="150" x2="415" y2="150"/><line class="a" x1="415" y1="210" x2="310" y2="210"/><line class="a" x1="685" y1="150" x2="790" y2="150"/><line class="a" x1="790" y1="210" x2="685" y2="210"/>
<rect class="n" x="220" y="330" width="660" height="85" rx="8"/><text class="h" x="550" y="360" text-anchor="middle">Ansvarsregel</text><text class="s" x="550" y="386" text-anchor="middle">Hvis informasjon må overleve operasjonen eller brukes senere, persisteres den i MariaDB.</text><text class="note" x="550" y="405" text-anchor="middle">msg er transient; flow/global/browser/HA-state er ikke domenepersistens.</text></svg>
