<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510"><style>.t{font:600 20px sans-serif;fill:#111}.h{font:600 15px sans-serif;fill:#111}.s{font:13px sans-serif;fill:#222}.b{fill:#fff;stroke:#555;stroke-width:1.4}.a{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#m)}.n{fill:#f6f6f6;stroke:#777;stroke-width:1.2}.note{font:12px sans-serif;fill:#444}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs>
<text class="t" x="30" y="35">Historisk catch-up og live evaluering</text>
<rect class="b" x="55" y="95" width="210" height="100" rx="8"/><text class="h" x="160" y="125" text-anchor="middle">Persistér chunk</text><text class="s" x="80" y="155">validerte 5-min data</text><text class="s" x="80" y="178">cursor i MariaDB</text>
<rect class="b" x="330" y="95" width="210" height="100" rx="8"/><text class="h" x="435" y="125" text-anchor="middle">Evaluer neste B</text><text class="s" x="355" y="155">sekvensiell kandidat</text><text class="s" x="355" y="178">transition → evaluation_id</text>
<rect class="b" x="605" y="95" width="210" height="100" rx="8"/><text class="h" x="710" y="125" text-anchor="middle">Evaluer neste P</text><text class="s" x="630" y="155">ready kan persisteres</text><text class="s" x="630" y="178">transition bare hvis policy</text>
<rect class="b" x="880" y="95" width="165" height="100" rx="8"/><text class="h" x="962" y="125" text-anchor="middle">Neste chunk</text><text class="s" x="900" y="155">etter ack</text><text class="s" x="900" y="178">ingen parallell replay</text>
<line class="a" x1="265" y1="145" x2="330" y2="145"/><line class="a" x1="540" y1="145" x2="605" y2="145"/><line class="a" x1="815" y1="145" x2="880" y2="145"/>
<rect class="n" x="160" y="300" width="330" height="115" rx="8"/><text class="h" x="325" y="330" text-anchor="middle">Historisk horizon</text><text class="s" x="190" y="360">session_measurement_sources.last_import_cutoff_at</text><text class="s" x="190" y="388">W-34/70: P1/P2 kan autoetableres;</text><text class="s" x="190" y="408">P3+ kan bli ready, men ikke aktivert.</text>
<rect class="n" x="610" y="300" width="330" height="115" rx="8"/><text class="h" x="775" y="330" text-anchor="middle">Live horizon</text><text class="s" x="640" y="360">MariaDB UTC clock</text><text class="s" x="640" y="388">B kan følge frozen regler.</text><text class="s" x="640" y="408">P-overgang krever operatørens Neste.</text></svg>
