<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><style>.t{font:600 20px sans-serif;fill:#111}.h{font:600 15px sans-serif;fill:#111}.s{font:13px sans-serif;fill:#222}.b{fill:#fff;stroke:#555;stroke-width:1.4}.a{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#m)}.n{fill:#f6f6f6;stroke:#777;stroke-width:1.2}.note{font:12px sans-serif;fill:#444}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs>
<text class="t" x="30" y="35">Dashboard – gjeldende målbildet</text>
<rect class="b" x="35" y="70" width="1030" height="55" rx="7"/><text class="h" x="550" y="103" text-anchor="middle">Gjæring  |  Biologi  |  Prosesstrinn  |  Analyse  |  Måleresultater  |  Template  |  Verifikasjon  |  Teknisk</text>
<rect class="n" x="55" y="155" width="300" height="120" rx="8"/><text class="h" x="205" y="185" text-anchor="middle">Gjæring</text><text class="s" x="75" y="215">SG / temperatur / B-P markører</text><text class="s" x="75" y="240">aktiv rapport og operatørstatus</text><text class="s" x="75" y="263">samme DB-eide datagap</text>
<rect class="n" x="400" y="155" width="300" height="120" rx="8"/><text class="h" x="550" y="185" text-anchor="middle">Analyse</text><text class="s" x="420" y="215">seks metadata-valgte grafer</text><text class="s" x="420" y="240">krav og kryssingstidspunkt</text><text class="s" x="420" y="263">ingen metric-spesifikk frontendlogikk</text>
<rect class="n" x="745" y="155" width="300" height="120" rx="8"/><text class="h" x="895" y="185" text-anchor="middle">Prosesstrinn / Biologi</text><text class="s" x="765" y="215">current candidate + overgangsbevis</text><text class="s" x="765" y="240">P ready ≠ P aktivert</text><text class="s" x="765" y="263">operatørbekreftede live-overganger</text>
<rect class="b" x="120" y="330" width="860" height="115" rx="8"/><text class="h" x="550" y="360" text-anchor="middle">Felles presentasjonskontrakt</text><text class="s" x="150" y="390">MariaDB/read-model leverer verdi, status, label, kravtekst, forklaring, gap og markører.</text><text class="s" x="150" y="416">Frontend renderer layout og grafgeometri – ikke domeneberegning eller fallback.</text></svg>
