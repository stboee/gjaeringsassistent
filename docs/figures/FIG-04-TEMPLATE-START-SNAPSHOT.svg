<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><style>.t{font:600 20px sans-serif;fill:#111}.h{font:600 15px sans-serif;fill:#111}.s{font:13px sans-serif;fill:#222}.b{fill:#fff;stroke:#555;stroke-width:1.4}.a{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#m)}.n{fill:#f6f6f6;stroke:#777;stroke-width:1.2}.note{font:12px sans-serif;fill:#444}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker></defs>
<text class="t" x="30" y="35">Registry → template → frozen session → generisk motor</text>
<rect class="b" x="45" y="105" width="210" height="180" rx="8"/><text class="h" x="150" y="135" text-anchor="middle">Registry</text><text class="s" x="65" y="165">modelltyper</text><text class="s" x="65" y="190">inputs / typed params</text><text class="s" x="65" y="215">metric outputdomene</text><text class="s" x="65" y="240">validator-vokabular</text><text class="s" x="65" y="265">generiske capabilities</text>
<rect class="b" x="320" y="105" width="210" height="180" rx="8"/><text class="h" x="425" y="135" text-anchor="middle">Publisert template</text><text class="s" x="340" y="165">B/P kriterier</text><text class="s" x="340" y="190">targets / actions</text><text class="s" x="340" y="215">replay-policy</text><text class="s" x="340" y="240">analysemetadata</text><text class="s" x="340" y="265">valideringsvalg</text>
<rect class="b" x="595" y="105" width="210" height="180" rx="8"/><text class="h" x="700" y="135" text-anchor="middle">Frozen session</text><text class="s" x="615" y="165">normaliserte session_*</text><text class="s" x="615" y="190">snapshotmetadata / SHA</text><text class="s" x="615" y="215">ingen live templateoppslag</text><text class="s" x="615" y="240">audit/provenance</text><text class="s" x="615" y="265">append-only revisions</text>
<rect class="b" x="870" y="105" width="190" height="180" rx="8"/><text class="h" x="965" y="135" text-anchor="middle">Generisk motor</text><text class="s" x="890" y="165">ingest / analyse</text><text class="s" x="890" y="190">B/P evaluator</text><text class="s" x="890" y="215">transactions</text><text class="s" x="890" y="240">ingen template-spesifikk</text><text class="s" x="890" y="265">hardkoding</text>
<line class="a" x1="255" y1="195" x2="320" y2="195"/><line class="a" x1="530" y1="195" x2="595" y2="195"/><line class="a" x1="805" y1="195" x2="870" y2="195"/>
<text class="note" x="550" y="355" text-anchor="middle">Start er freeze-grensen: senere templateendringer endrer ikke en eksisterende session.</text></svg>
